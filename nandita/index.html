<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nandita &amp; Siddharth — RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body data-side="Bride's side (Nandita)">
  <main class="card">
    <div class="monogram">N &middot; S</div>
    <h1>Nandita <span class="amp">&amp;</span> Siddharth</h1>
    <div class="side-tag">Bride's Side</div>
    <p class="invite-line">
      Together with their families, request the pleasure of your company
      as they begin their new life together.
    </p>

    <form id="rsvp-form">
      <div class="field">
        <label for="name">Your Full Name</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="e.g. Priya Verma" />
      </div>

      <div class="field">
        <label>Will you be attending?</label>
        <div class="choice-row">
          <span>
            <input type="radio" id="attend-yes" name="attending" value="Yes" required />
            <label class="choice" for="attend-yes">Joyfully Accept</label>
          </span>
          <span>
            <input type="radio" id="attend-no" name="attending" value="No" />
            <label class="choice" for="attend-no">Regretfully Decline</label>
          </span>
        </div>
      </div>

      <div class="field" id="guests-field">
        <label for="guests">Number of Guests in Your Family (including you)</label>
        <input type="number" id="guests" name="guests" min="1" max="15" value="1" />
      </div>

      <div class="field">
        <label for="message">Message for the Couple (optional)</label>
        <textarea id="message" name="message" placeholder="Your wishes…"></textarea>
      </div>

      <button type="submit">Send RSVP</button>
      <p id="form-error" class="hidden"></p>
    </form>

    <div id="thank-you" class="hidden">
      <p class="big">Thank you!</p>
      <p id="thank-you-text"></p>
    </div>

    <p class="footer-note">With love, Nandita &amp; Siddharth</p>
  </main>

  <script src="../assets/config.js"></script>
  <script src="../assets/rsvp.js"></script>
</body>
</html>
